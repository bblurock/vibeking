[package]
name = "vibeking"
version = "0.1.0"
description = "Voice typing for macOS with local or cloud speech recognition"
authors = ["Benson Lu"]
license = "MIT"
repository = "https://github.com/bblurock/vibeking"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vibeking_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-os = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
cpal = "0.16"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
bytes = "1"
enigo = "0.6"
anyhow = "1"
log = "0.4"
futures-util = "0.3"
dirs = "5"
regex = "1.12.3"
strsim = "0.11"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[target."cfg(target_os = \"macos\")".dependencies.whisper-rs]
version = "0.14"
default-features = false
features = ["metal"]

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSResponder", "NSView", "NSApplication", "NSScreen"] }
objc2-foundation = "0.3"
block2 = "0.6"
core-graphics = "0.25"
core-foundation = "0.10"
# Vendored MIT fork provides the token timings used by live transcription.
# See vendor/fluidaudio-rs/FORK_NOTES.md and THIRD_PARTY_NOTICES.md.
fluidaudio-rs = { path = "../vendor/fluidaudio-rs", default-features = false, features = ["asr"] }
