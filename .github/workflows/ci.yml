name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.20.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch pinned sidecar
        run: bash scripts/fetch-uv.sh
      - name: Build frontend
        run: pnpm build
      - name: Select stable Rust
        run: rustup default stable
      - name: Test native code
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --lib --tests
      - name: Build desktop application
        run: pnpm tauri build --bundles app
