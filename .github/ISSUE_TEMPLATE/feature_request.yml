name: Feature request
description: Suggest an improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Describe the change and any alternatives you considered.
    validations:
      required: true
